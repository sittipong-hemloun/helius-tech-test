packages:
  - apps/*
  - packages/*
  - tests/*

# pnpm blocks dependency install scripts unless listed here.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - dotenv@18.0.5
  - globals@17.13.0
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
