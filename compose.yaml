# Employee Console — local development services (PRD §13.1).
# Core:        postgres (dev/test/perf databases). Web/API run on the host with hot reload (`pnpm dev`).
# Profiles:    automation → n8n · ci → Jenkins controller · ai-workspace → Open WebUI
# Every port binds to 127.0.0.1 only. Secrets come from `.env` (generated by `pnpm run setup`).
name: employee-console

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run pnpm run setup}
      APP_DB_USER: ${APP_DB_USER:-employee_console_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run pnpm run setup}
      APP_DATABASES: employee_console_dev
      # Separate CREATEDB role for test/perf runners; the app role cannot create databases.
      TEST_DB_USER: ${TEST_DB_USER:-employee_console_test}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:-}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  n8n:
    profiles: [automation]
    image: docker.n8n.io/n8nio/n8n:2.41.5
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?run pnpm run setup}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run pnpm run setup}
      GENERIC_TIMEZONE: Asia/Bangkok
      TZ: Asia/Bangkok
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # Workflows read INTERNAL_API_URL / GEMINI_API_BASE via $env.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      INTERNAL_API_URL: ${N8N_INTERNAL_API_URL:-http://api-staging:3001/internal/v1}
      GEMINI_API_BASE: https://generativelanguage.googleapis.com/v1beta
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows/n8n:/workflows:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, shared]

  jenkins:
    profiles: [ci]
    build:
      context: ./infra/jenkins
    image: employee-console/jenkins:2.580.1-lts-jdk21
    restart: unless-stopped
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID:-admin}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?run pnpm run setup}
      JENKINS_AGENT_WORKDIR: ${JENKINS_AGENT_WORKDIR:-/tmp/employee-console-jenkins-agent}
      # Absolute path of this repo on the host; mounted at the same path so the controller
      # (Jenkinsfile lookup) and the host agent (checkout) share one file:// URL.
      JENKINS_LOCAL_REPO: ${JENKINS_LOCAL_REPO:-/repo}
      JENKINS_GIT_URL: ${JENKINS_GIT_URL:-}
      JENKINS_GIT_BRANCH: ${JENKINS_GIT_BRANCH:-main}
      GIT_CREDENTIAL_ID: ${GIT_CREDENTIAL_ID:-}
      CASC_JENKINS_CONFIG: /usr/share/jenkins/ref/casc.yaml
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ${JENKINS_LOCAL_REPO:-./}:${JENKINS_LOCAL_REPO:-/repo}:ro
      - ./.env.staging:/run/secrets/staging.env:ro

  open-webui:
    profiles: [ai-workspace]
    image: ghcr.io/open-webui/open-webui:v0.11.4
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?run pnpm run setup}
      WEBUI_NAME: Employee Console AI workspace
      # First account created becomes admin; then signup is closed (PRD §12.7).
      ENABLE_SIGNUP: ${OPEN_WEBUI_ENABLE_SIGNUP:-true}
      DEFAULT_USER_ROLE: pending
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      OPENAI_API_KEY: ${GEMINI_API_KEY:-}
      DEFAULT_MODELS: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ENABLE_WEB_SEARCH: "false"
      ENABLE_RAG_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_ADMIN_EXPORT: "false"
      ANONYMIZED_TELEMETRY: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
    ports:
      - "127.0.0.1:3002:8080"
    volumes:
      - open_webui_data:/app/backend/data

volumes:
  pgdata:
  n8n_data:
  jenkins_home:
  open_webui_data:

networks:
  default: {}
  # Shared with the staging project so n8n can reach api-staging on the Docker network.
  # Created by `pnpm dev:up` / `pnpm ai:up` / `pnpm staging:up` (docker network create).
  shared:
    name: employee-console-shared
    external: true
